; v4.8 : pipeline officiel d'Unreal pour la cible de localisation Game (Gather).
; Lancer : UnrealEditor-Cmd Backrooms.uproject -run=GatherText -config=Config/Localization/Game_Gather.ini
; Equivalent sans Unreal : Tools/Localization/loc_extract.py et loc_build.py (memes fichiers .po et .locres).

[CommonSettings]
ManifestDependencies=%LOCENGINEROOT%Content/Localization/Engine/Engine.manifest
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCultureIndex=0
CulturesToGenerate=fr
CulturesToGenerate=en
CulturesToGenerate=de
CulturesToGenerate=es-ES
CulturesToGenerate=pt-BR
CulturesToGenerate=ru
CulturesToGenerate=it
CulturesToGenerate=tr
CulturesToGenerate=es-419
CulturesToGenerate=pl
CulturesToGenerate=zh-Hans
CulturesToGenerate=uk
CulturesToGenerate=ar
CulturesToGenerate=ko
CulturesToGenerate=fa
CulturesToGenerate=ja
CulturesToGenerate=hu
CulturesToGenerate=cs
CulturesToGenerate=pt-PT
CulturesToGenerate=sv
CulturesToGenerate=zh-Hant
CulturesToGenerate=id

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/Backrooms
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive

[GatherTextStep3]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
