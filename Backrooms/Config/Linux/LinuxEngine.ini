; v4.9 : profil de base Linux (Vulkan) : rendu eprouve, sans ray tracing materiel.
; Le ray tracing Vulkan d'Unreal depend du moteur, du pilote et de la carte ; il n'est pas valide pour ce jeu. Lumen reste
; actif en logiciel (champs de distance), avec les ombres virtuelles. Le jeu lit les capacites reelles au lancement
; (IsRayTracingEnabled) : une preference RT venue d'un autre ordinateur est gardee mais sans effet.
; Pour essayer le ray tracing Vulkan apres validation sur une machine : passer les trois lignes ci-dessous a True / 1.
[/Script/Engine.RendererSettings]
r.RayTracing=False
r.Lumen.HardwareRayTracing=False
r.RayTracing.Geometry.SkeletalMeshes=0
