[/Script/UnrealEd.EditorLoadingSavingSettings]
; v4.8 : Content/Fonts contient des polices .ttf lues au lancement (BRFonts.cpp), pas des assets : l'editeur ne doit pas les
; importer automatiquement (comme Content/Localization, exclu par defaut)
!AutoReimportDirectorySettings=ClearArray
+AutoReimportDirectorySettings=(SourcePath="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*",bInclude=False),(Wildcard="Fonts/*",bInclude=False)))
