[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Backrooms/Maps/L_Backrooms.L_Backrooms
EditorStartupMap=/Game/Backrooms/Maps/L_Backrooms.L_Backrooms
GlobalDefaultGameMode=/Script/Backrooms.BRGameMode

[/Script/Engine.RendererSettings]
; Eclairage 100 % dynamique : Lumen (GI + reflets) et ombres virtuelles
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.AntiAliasingMethod=4
r.Lumen.TraceMeshSDFs=1
r.SkinCache.CompileShaders=True
; v4.5 : entites a squelette (SK_*) dans les structures de ray tracing (reflets, ombres de la lampe) : cache de skinning
; actif pour tous les maillages a squelette (inclusif) ; changer ces lignes demande un redemarrage
r.SkinCache.Mode=1
r.SkinCache.DefaultBehavior=1
r.RayTracing.Geometry.SkeletalMeshes=1
; RTX : ray tracing materiel (Lumen en RT materiel si la carte le permet, sinon repli logiciel automatique)
r.RayTracing=True
; Ombres : virtuelles (VSM) pour toutes les lumieres ; la lampe torche passe en ombres ray tracees dans le profil
; Cinematique (reglage par lumiere, BRCharacter::SetFlashlightRayTracedShadows)
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=0
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=True
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.Water.SingleLayer=1
r.VolumetricFog=True
; v4.8 : shaders prepares avant d'etre utilises (PSO) : a la creation des composants (chunks, entites, combinaison), un
; objet dont les shaders ne sont pas prets attend d'etre dessine au lieu de provoquer une saccade de compilation ; cache
; des PSO du paquet (enregistrer les PSO d'une partie avec -logPSO, voir Docs/RAPPORT_v4.8.md)
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.ShaderPipelineCache.Enabled=1

[DevOptions.Shaders]
; v4.8 : cles stables des shaders, necessaires pour constituer le cache des PSO du paquet (stablepc)
NeedsShaderStableKeys=true

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.Engine]
